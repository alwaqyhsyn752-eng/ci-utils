name: v2 Hardened Host Validator

on:
  workflow_dispatch:
    inputs:
      hosts:
        description: 'Comma-separated host:port list to validate'
        required: true
      models:
        description: 'Max models to test per host'
        required: true
        default: '3'
      workers:
        description: 'Concurrent host workers'
        required: true
        default: '8'
      timeout:
        description: 'Per-request timeout seconds'
        required: true
        default: '12'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install aiohttp

      - name: Run v2 hardened validation
        run: |
          python3 validate_v2.py \
            --hosts "${{ github.event.inputs.hosts }}" \
            --models "${{ github.event.inputs.models }}" \
            --workers "${{ github.event.inputs.workers }}" \
            --timeout "${{ github.event.inputs.timeout }}" \
            -o validate_v2_results.json

      - name: Upload validation results
        uses: actions/upload-artifact@v4
        with:
          name: validation-v2-${{ github.run_id }}
          path: validate_v2_results.json
