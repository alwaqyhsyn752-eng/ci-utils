name: Multi-Port Masscan & Live Validator

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target IP range / CIDR or single IP'
        required: true
        default: '43.133.0.0/16 43.153.0.0/16'
      ports:
        description: 'Ports to scan'
        required: true
        default: '8000,8080,3000,3001,3002,3003,3004,3005,4000,30000,8081,8082,8088,8089,8090,5000,5001,8001,8002,6333,2375'
      rate:
        description: 'Packet rate (PPS)'
        required: true
        default: '10000'

jobs:
  scan_and_validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y masscan
          pip install aiohttp requests

      - name: Run Masscan Sweep
        run: |
          echo "🚀 Starting Masscan sweep on ${{ github.event.inputs.target }} for ports ${{ github.event.inputs.ports }} @ ${{ github.event.inputs.rate }} pps..."
          sudo masscan -p${{ github.event.inputs.ports }} ${{ github.event.inputs.target }} --rate ${{ github.event.inputs.rate }} -oJ hits.json || true
          
          if [ -f hits.json ]; then
            echo "Masscan finished. Raw hit entries: $(grep -c '"ip"' hits.json 2>/dev/null || echo 0)"
          else
            echo "[]" > hits.json
          fi

      - name: Run v2 Hardened Validation on All Hits
        run: |
          python3 validate_v2.py \
            --hosts hits.json \
            --models 0 \
            --workers 32 \
            --timeout 10 \
            -o validated_compute.json

      - name: Upload Validated Compute Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-validated-compute-${{ github.run_id }}
          path: |
            validated_compute.json
            validated_compute.jsonl
            hits.json
